<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Telisik</title>
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="icons/icon-32.png" type="image/png">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="page.js"></script>
  </head>
  <body data-surface="popup">
    <main class="page">
      <h1 class="wordmark">Telisik<sup aria-hidden="true">1</sup></h1>
      <form id="search-form" class="search" role="search">
        <label for="q" class="visually-hidden">Search the sources</label>
        <input id="q" name="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="300" placeholder="Search the sources" autofocus>
        <button type="submit" class="search-button">Search</button>
      </form>
      <p class="footnote"><sup aria-hidden="true">1</sup> Opens the results in a new tab.</p>
      <p id="firefox-hint" class="popup-hint" hidden>In Firefox, click in the box first if typing does nothing.</p>
    </main>
  </body>
</html>
